[project]
name = "odotoken"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
odotoken = "odotoken.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
