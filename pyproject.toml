[project]
name = "odotoken"
version = "0.3.0"
description = "Transparent AI token metering proxy, usage tracker and budget guard"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
odotoken = "odotoken.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]
local-tokenizers = [
    "tiktoken>=0.7.0",
    "sentencepiece>=0.1.99",
]
metrics = [
    "prometheus-client>=0.19.0",
]
opentelemetry = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
]
all = [
    "tiktoken>=0.7.0",
    "sentencepiece>=0.1.99",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "BLE", "ASYNC", "PERF", "RUF"]
ignore = [
  # FastAPI Depends()/Typer Option()/Argument() as argument defaults is idiomatic
  "B008",
  # proxy/parsers intentionally tolerate malformed upstream payloads with broad excepts
  "BLE001",
  "S110",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/odotoken/tests/*" = ["S101", "S603"]
# CLI commands are one-shot processes; blocking file reads inside the async
# closure never contend with anything. Not worth aiofiles for this.
"src/odotoken/cli/*" = ["ASYNC230", "ASYNC240"]
# /tmp/odotoken.pid: fixed path is the CLI contract (start writes, stop reads)
"src/odotoken/cli/main.py" = ["S108", "S108"]
# chaos.py: seeded random.Random for deterministic chaos tests, not crypto
"src/odotoken/api/chaos.py" = ["S311"]
# dashboard.py carries a large inline HTML/JS template; prettier for markup
# would mangle it. Line length exempted there.
"src/odotoken/dashboard.py" = ["E501"]  # assert usage in tests is the point

[tool.pytest.ini_options]
asyncio_mode = "auto"
