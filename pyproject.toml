[project]
name = "odotoken"
version = "0.1.0"
description = "Transparent AI token metering proxy, usage tracker and budget guard"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
odotoken = "odotoken.cli:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]
local-tokenizers = [
    "tiktoken>=0.7.0",
    "sentencepiece>=0.1.99",
]
metrics = [
    "prometheus-client>=0.19.0",
]
opentelemetry = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
]
all = [
    "tiktoken>=0.7.0",
    "sentencepiece>=0.1.99",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]