name: Terraform Provider CI

on:
  push:
    paths:
      - 'providers/terraform/**'
      - '.github/workflows/terraform-provider-ci.yml'
  pull_request:
    paths:
      - 'providers/terraform/**'
      - '.github/workflows/terraform-provider-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: providers/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...