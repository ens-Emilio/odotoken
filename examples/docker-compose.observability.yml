# Optional observability stack: Prometheus + Grafana scraping odotoken.
# Usage:
#   docker compose -f examples/docker-compose.observability.yml up -d
#   → Grafana at http://localhost:3000 (admin/admin), dashboard auto-provisioned.
services:
  odotoken:
    # Only needed if you run odotoken itself in Docker; when running on the
    # host, comment this service out — Prometheus uses host.docker.internal.
    image: python:3.13-slim
    profiles: ["with-odotoken"]
    working_dir: /app
    command: .venv/bin/odotoken start --host 0.0.0.0 --port 8090
    ports:
      - "8090:8090"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/odotoken.json:ro
      - grafana-provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  grafana-provisioning: